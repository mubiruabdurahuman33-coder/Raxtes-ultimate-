name: Build RAXTES EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install flask requests youtubesearchpython pywebview pyinstaller
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name RAXTES-MovieBox app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RAXTES-EXE
          path: dist/RAXTES-MovieBox.exe
