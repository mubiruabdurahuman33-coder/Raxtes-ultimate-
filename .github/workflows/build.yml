name: Build RAXTES EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install flask requests pyinstaller
      - run: pyinstaller --onefile --name RAXTES-MovieBox app.py
      - uses: actions/upload-artifact@v4
        with:
          name: RAXTES-EXE
          path: dist/RAXTES-MovieBox.exe
